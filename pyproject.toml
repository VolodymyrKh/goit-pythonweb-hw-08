[project]
name = "goit-pythonweb-hw-08"
version = "0.1.0"
description = "REST API for storing and managing contacts (FastAPI + SQLAlchemy + PostgreSQL)"
authors = [
    { name = "Volodymyr", email = "volodymyr_kh@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false
